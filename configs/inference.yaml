# Конфиг inference.py. AF — LightGBM (задача 03); BS — заглушка на правилах до задачи 04.
seed: 42
num_threads: 4

af:
  model: lgbm            # lgbm | rules (контекстное правило шага 0 — также аварийный вариант, если нет весов)
  weights_dir: weights   # af_lgbm_fold{0..4}.txt + af_lgbm_meta.json (порог подобран по OOF)
  num_threads: 4         # потоки LightGBM predict (фиксировано для детерминизма)

bs:
  model: rules
  dnbr_thresholds: [0.10, 0.27, 0.44]   # USGS: слабая / средняя / сильная
