# КАНДИДАТ v5 (ночной режим, ветка task/bs-lovasz): многомасштабный BS-ансамбль. По умолчанию ВЫКЛЮЧЕН — включается так:
#   python inference.py --data-dir data/test --output out/submission_night_ms.csv --config configs/inference_bs_night.yaml
# BS: база стека = среднее UNet v1, v4 (1×, weights/) и v4, обученного на масштабе 0.75; доп. канал стека — UNet
# половинного разрешения; ворота стека 0.01. OOF: 0.4965 / 0.5116 / обл. 0.4520 (финал: 0.4912 / 0.5008 / 0.4401).
seed: 42
workers: 8

af:
  model: lgbm
  fallback: rules
  weights_dir: weights
  num_threads: 8

bs:
  model: unet
  fallback: rules
  unet_weights:
    - weights/bs_unet_r34_cedice.pt
    - weights/bs_unet_r34_v4.pt
    - weights_night_3/bs_unet_s075_v4.pt
  aux_unet_weights:
    - weights_night_3/bs_unet_half_v4.pt
  stack_weights: weights_night_3/bs_stack.txt
  stack_gate: 0.01
  decode_file: weights_night_3/bs_decode.json
