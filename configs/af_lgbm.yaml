# Модуль AF: LightGBM по пикселям-кандидатам. Обучение: python train.py --module af
seed: 42
data_dir: data/train
cache: data/cache/af_train.npz      # пиксельный датасет (признаки); пересоздаётся при смене набора признаков
weights_dir: weights
n_rounds: 2000
params:
  objective: binary
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 50
  feature_fraction: 0.8
  lambda_l2: 1.0
  scale_pos_weight: 1.0
  deterministic: true
  force_row_wise: true
  num_threads: 8
  seed: 42
  verbosity: -1
